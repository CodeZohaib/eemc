<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>EEMC Warehouse | Terminal Locked</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.3.0/index.css" crossorigin="anonymous" />
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="dist/css/adminlte.css" />

    <style>
      body, html {
        height: 100%;
        margin: 0;
        font-family: 'Source Sans 3', sans-serif;
        background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        color: #fff;
      }
      .lockscreen-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        padding: 20px;
      }
      .lockscreen-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 40px;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      }
      .lockscreen-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        border: 3px solid #0d6efd;
        object-fit: cover;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
      }
      .terminal-badge {
        background: rgba(13, 110, 253, 0.2);
        color: #38bdf8;
        border: 1px solid rgba(13, 110, 253, 0.4);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: inline-block;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>

    <main class="lockscreen-wrapper">
      
      <div class="lockscreen-card">
        
        <div class="mb-2">
          <span class="terminal-badge"><i class="bi bi-shield-lock-fill me-1"></i> Session Locked</span>
        </div>

        <!-- User Avatar -->
        <div>
          <img src="dist/assets/img/user1-128x128.jpg" alt="Zohaib Khan" class="lockscreen-avatar" />
        </div>

        <!-- Name & Status -->
        <h4 class="fw-bold text-white mb-1">Zohaib Khan</h4>
        <p class="text-white-50 text-xs mb-4">EEMC Warehouse & Logistics • Receiving Terminal</p>

        <!-- Password Form -->
        <form action="index.html" method="POST">
          <div class="input-group mb-3">
            <input
              id="lockscreenPassword"
              type="password"
              class="form-control bg-white text-dark shadow-none border-0 py-2"
              placeholder="Enter your password..."
              required
              autofocus
            />
            <button type="submit" class="btn btn-primary px-4 fw-bold" aria-label="Unlock Session">
              <i class="bi bi-arrow-right fs-5"></i>
            </button>
          </div>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary">
          <a href="login.html" class="text-xs text-decoration-none text-info fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Sign in as a different user
          </a>
        </div>

      </div>

      <!-- Footer Info -->
      <div class="mt-4 text-center">
        <small class="text-white-50 text-xs">
          EEMC Warehouse & Logistics &bull; Copyright &copy; 2026
        </small>
      </div>

    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <script src="dist/js/adminlte.js"></script>
  </body>
</html>
